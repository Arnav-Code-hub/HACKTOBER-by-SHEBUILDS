# Local development stack. Production overrides live in docker-compose.prod.yml;
# docker-compose.override.yml is auto-loaded on top of this for hot reload.
#
# The API and the worker are the SAME image with different commands — the worker
# needs the same models, config and DB session as the API, so splitting the
# codebase would only duplicate dependencies.

name: janmaang

services:
  postgres:
    # Built, not pulled: the stock postgis image has no pgvector, and init.sql
    # needs both extensions. See infrastructure/docker/postgres/Dockerfile.
    build:
      context: ./infrastructure/docker/postgres
      dockerfile: Dockerfile
    image: janmaang/postgres:16-3.4-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janmaang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janmaang}
      POSTGRES_DB: ${POSTGRES_DB:-janmaang}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janmaang} -d ${POSTGRES_DB:-janmaang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-janmaang}:${POSTGRES_PASSWORD:-janmaang}@postgres:5432/${POSTGRES_DB:-janmaang}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai:8001
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # Same image as api, different entrypoint.
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    command: arq app.worker.WorkerSettings
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-janmaang}:${POSTGRES_PASSWORD:-janmaang}@postgres:5432/${POSTGRES_DB:-janmaang}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - path: ./services/ai/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/1
    ports:
      - "${AI_PORT:-8001}:8001"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    command: pnpm --filter @janmaang/web dev
    env_file:
      - path: ./apps/web/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_started }

  # Catches every outbound email in development. UI on :8025.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    profiles: [tools]

volumes:
  postgres_data:
  redis_data:
