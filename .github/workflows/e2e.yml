name: E2E

# Not on the PR fast path — E2E boots the whole stack and takes minutes. The PR
# gate must stay under five minutes or people start bypassing branch protection.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # docker-compose.override.yml is auto-loaded by every `docker compose`
      # call, including the ones inside scripts/. It bind-mounts host source
      # for hot reload and says so itself: never in CI. Pin the file list.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Prepare environment files
        run: |
          find . -name '.env.example' -not -path './.git/*' \
            -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;

      - name: Boot the stack
        run: |
          docker compose up -d --build postgres redis api worker ai web
          bash scripts/wait-for-postgres.sh
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seeds

      - run: pnpm --filter @janmaang/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @janmaang/e2e e2e

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report/, retention-days: 7 }
