name: Deploy · staging

# Automatic on merge to main. Staging is where main is continuously verified;
# production is a deliberate, approved act (deploy-production.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC federation — no long-lived cloud keys in CI
    strategy:
      # One image failing must not cancel the others — a half-built matrix
      # tells you nothing about whether the rest are healthy.
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ./services/api, dockerfile: ./services/api/Dockerfile }
          - { name: ai,  context: ./services/ai,  dockerfile: ./services/ai/Dockerfile }
          - { name: web, context: .,              dockerfile: ./apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io rejects uppercase repository names, and github.repository
      # carries the repo's own casing. Lowercase it once, here.
      - name: Lowercase image namespace
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:staging
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Migrate and deploy
        run: |
          echo "TODO(deploy): alembic upgrade head, then roll the services."
          echo "Runtime secrets come from the platform's secret manager — CI holds"
          echo "deploy credentials only and never sees LLM_API_KEY."
      - name: Smoke test
        run: bash infrastructure/scripts/smoke-test.sh "${{ vars.STAGING_URL }}"
