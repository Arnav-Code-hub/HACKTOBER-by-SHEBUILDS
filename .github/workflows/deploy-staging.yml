name: Build staging images

# Publishing container images does not deploy a running application.
# An optional manual check can verify an already-hosted API.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Existing staging API origin to smoke-test; leave blank to build images only"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC federation — no long-lived cloud keys in CI
    strategy:
      # One image failing must not cancel the others — a half-built matrix
      # tells you nothing about whether the rest are healthy.
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ./services/api, dockerfile: ./services/api/Dockerfile }
          - { name: ai,  context: ./services/ai,  dockerfile: ./services/ai/Dockerfile }
          - { name: web, context: .,              dockerfile: ./apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io rejects uppercase repository names, and github.repository
      # carries the repo's own casing. Lowercase it once, here.
      - name: Lowercase image namespace
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:staging
            ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  verify_staging:
    name: Check an existing staging API
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_url != '' }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: bash infrastructure/scripts/smoke-test.sh "$STAGING_URL"
