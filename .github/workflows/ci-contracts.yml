name: CI · contracts

# The monorepo's core argument, enforced: a schema change cannot merge without
# its generated clients updated in the same PR. In a multirepo this drift is
# invisible until the mobile app fails against a deployed API.
on:
  pull_request:
    paths: ["services/api/**", "packages/contracts/**", ".github/workflows/ci-contracts.yml"]

jobs:
  generated-output-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-service
        with: { service: services/api }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Export OpenAPI schema
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
          AUTH_SECRET: ci-only-secret-value-not-real
        run: |
          uv run python -c "import json;from app.main import create_app;print(json.dumps(create_app().openapi(), indent=2))" \
            > ../../packages/contracts/openapi/openapi.json

      - name: Regenerate the TypeScript client
        run: |
          mkdir -p packages/contracts/src/generated
          pnpm --filter @janmaang/contracts exec openapi-typescript \
            packages/contracts/openapi/openapi.json \
            -o packages/contracts/src/generated/api.ts

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --quiet -- packages/contracts; then
            echo "::error::Generated contracts are out of date. Run 'make contracts' and commit the result."
            git diff --stat -- packages/contracts
            exit 1
          fi
          echo "Contracts are current."
