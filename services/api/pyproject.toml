[project]
name = "janmaang-api"
version = "0.1.0"
description = "JanMaang API — modular monolith. Owns the schema; the worker shares this image."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.15.2",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "httpx>=0.27.2",
    "firebase-admin>=6.6.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.8.2",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "firebase_admin.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (testcontainers)",
    "slow: excluded from the PR fast path",
]

# ─────────────────────────────────────────────────────────────────────────────
# Module boundaries.
#
# The cross-module rule ("no module may import another module's models or
# repository") is enforced by tests/unit/test_module_boundaries.py, which walks
# the AST. It is NOT expressed here: an import-linter `forbidden` contract with
# two wildcards does not correlate them, so `projects.service -> problems.models`
# would pass while looking like it was covered. An exact check is worth more
# than a rule that only appears to hold.
#
# What import-linter does enforce is the dependency direction below, which its
# contract types express precisely.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core and shared never depend on modules"
type = "forbidden"
source_modules = ["app.core", "app.shared"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "shared never depends on core"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.core"]
